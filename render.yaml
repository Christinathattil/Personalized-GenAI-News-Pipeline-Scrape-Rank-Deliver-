# Render Blueprint (Infrastructure-as-Code)
# Docs: https://render.com/docs/infrastructure-as-code

services:
  # ---------------------------------------------------------------------------
  # FastAPI back-end
  # ---------------------------------------------------------------------------
  - type: web
    runtime: python
    name: ai-news-api
    rootDir: ai-news-aggregator
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -e .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # DATABASE_URL is injected automatically from the referenced database
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString

      # Base URL used in confirmation emails (update once service URL is known)
      - key: BASE_URL
        # placeholder; Render will inject final URL after first deploy
        value: https://ai-news-api.onrender.com

      # HuggingFace token for summarisation model
      - key: HUGGINGFACE_API_TOKEN
        sync: false  # add via Render dashboard

      # SMTP credentials (Gmail, SendGrid, etc.)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        value: "AI News Digest <no-reply@yourdomain.com>"

  # ---------------------------------------------------------------------------
  # React front-end (static site)
  # ---------------------------------------------------------------------------
  - type: web
    runtime: static
    name: ai-news-frontend
    rootDir: ai-news-aggregator/frontend
    buildCommand: |
      npm ci
      npm run build
    staticPublishPath: dist
    headers:
      # Ensure SPA routing works
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Fallback to index.html for client-side routing
      - source: /.*
        destination: /index.html
        type: rewrite

# -----------------------------------------------------------------------------
# PostgreSQL database (Render automatically injects DATABASE_URL)
# -----------------------------------------------------------------------------
databases:
  - name: ai-news-db
    plan: free
