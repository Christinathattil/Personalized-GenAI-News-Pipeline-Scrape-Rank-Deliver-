[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "docling>=2.70.0",
    "feedparser>=6.0.12",
    "openai>=2.15.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "huggingface-hub>=0.22.2",
    "sqlalchemy>=2.0.46",
    "youtube-transcript-api>=0.6.2",
    "tiktoken>=0.12.0",
    "httpx>=0.28.1",
    "asyncio-throttle>=1.0.2",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic[email]>=2.12.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]

[tool.setuptools]
packages = ["app"]
